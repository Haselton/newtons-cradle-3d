name: Build Native Android APK

on:
  push:
    branches: [ main, newton-engine-rebuild ]
    paths:
      - 'native/**'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned Newton Dynamics engine
        run: git clone --depth 1 https://github.com/JulioJerez/newton-dynamics.git app/src/main/cpp/newton-dynamics

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewtonsCradle3D-debug
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
