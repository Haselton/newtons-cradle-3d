plugins { id 'com.android.application' }

configurations { natives }

android {
    namespace 'com.haseltonmediagroup.newtonscradle3d'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId 'com.haseltonmediagroup.newtonscradle3d'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '1.12.1'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O3'
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    signingConfigs {
        release {
            def signingPath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildFeatures { buildConfig true }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-3940256099942544/9214589741"'
        }
        release {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-1051867648799965~6304694010']
            buildConfigField 'String', 'ADMOB_BANNER_ID', '"ca-app-pub-1051867648799965/1603031670"'
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('src/main/jniLibs/arm64-v8a').mkdirs()
        file('src/main/jniLibs/armeabi-v7a').mkdirs()
        file('src/main/jniLibs/x86_64').mkdirs()
        configurations.natives.files.each { jar ->
            def abi = jar.name.contains('natives-arm64-v8a') ? 'arm64-v8a' :
                    jar.name.contains('natives-armeabi-v7a') ? 'armeabi-v7a' : 'x86_64'
            copy {
                from zipTree(jar)
                into "src/main/jniLibs/${abi}"
                include '*.so'
            }
        }
    }
}

preBuild.dependsOn copyAndroidNatives
